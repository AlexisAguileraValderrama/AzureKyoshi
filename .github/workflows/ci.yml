name: CI — Build & Validate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AzureKyoshi.slnx

      - name: Build solution (Release)
        run: dotnet build AzureKyoshi.slnx --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Verify EF Core migrations match model
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project AzureKyoshi.Api/AzureKyoshi.Api.csproj \
            --configuration Release \
            --no-build

      - name: Publish Blazor WASM check
        run: dotnet publish AzureKyoshi.Client/AzureKyoshi.Client.csproj --configuration Release --no-restore -o ./publish-check/client

      - name: Publish Azure Functions API check
        run: dotnet publish AzureKyoshi.Api/AzureKyoshi.Api.csproj --configuration Release --no-restore -o ./publish-check/api
